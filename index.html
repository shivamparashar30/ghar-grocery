<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Monthly ration list — tap to tick off, add prices, print.">
<title>Ration List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
</head>
<body>

<!-- ===================== MONTH PICKER ===================== -->
<section id="monthView">
  <div class="wrap">
    <header class="mhead">
      <h1>राशन लिस्ट</h1>
      <p>Ration List · महीना चुनें</p>
      <div id="syncPill" class="pill">…</div>
    </header>
    <div id="monthCards" class="mcards"></div>
    <p class="foot">डेटा सब डिवाइस पर एक जैसा रहता है · shared across devices</p>
  </div>
</section>

<!-- ===================== LIST ===================== -->
<section id="listView" hidden>
  <header class="lhead">
    <div class="wrap">
      <div class="lbar">
        <button id="back" class="icon" aria-label="back">←</button>
        <div class="ltitle">
          <h2 id="mTitle">—</h2>
          <p id="mSub">—</p>
        </div>
        <button id="menu" class="icon" aria-label="menu">⋯</button>
      </div>

      <div class="stats">
        <div class="stat"><span class="k">लिया · Done</span><b id="sDone">0/0</b></div>
        <div class="stat"><span class="k">बाकी · Left</span><b id="sLeft">0</b></div>
        <div class="stat"><span class="k">खर्च · Spent</span><b id="sSpent" class="g">₹0</b></div>
      </div>
      <div class="bar"><span id="bar"></span></div>

      <input type="search" id="q" placeholder="खोजें · search (e.g. pisa, moong)" autocomplete="off">
      <div class="chips" id="chips">
        <button data-f="all" class="on">सब</button>
        <button data-f="todo">बाकी</button>
        <button data-f="done">लिया</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="list"></main>

  <footer class="lfoot">
    <div class="wrap fbar">
      <div class="tot"><span>कुल · Total</span><b id="total">₹0</b></div>
      <button class="btn" id="printBtn">डाउनलोड / Print</button>
    </div>
  </footer>
</section>

<input type="file" id="file" accept="application/json,.json" hidden>

<!-- ===================== MENU ===================== -->
<div id="sheet" class="sheet">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel">
    <div class="grab"></div>
    <button class="mi" id="mAdd">➕ <span>नया आइटम · Add item</span></button>
    <button class="mi" id="mPrint">🖨️ <span>Print / Save as PDF</span></button>
    <button class="mi" id="mCopy">📋 <span>Copy as text</span></button>
    <button class="mi" id="mExport">⬇️ <span>Export backup</span></button>
    <button class="mi" id="mImport">⬆️ <span>Import backup</span></button>
    <button class="mi" id="mRestore">♻️ <span>Restore deleted (0)</span></button>
    <button class="mi close" data-close>Close</button>
  </div>
</div>

<!-- ===================== PRINT OPTIONS ===================== -->
<div id="prsheet" class="sheet">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel">
    <div class="grab"></div>
    <h3 class="sh">क्या प्रिंट करें · What to print</h3>
    <label class="opt"><input type="checkbox" id="o_todo"><span>बाकी लिस्ट · Still to buy<small>भाव नहीं, टिक बॉक्स के साथ</small></span></label>
    <label class="opt"><input type="checkbox" id="o_done"><span>लिया हुआ · Bought<small>मात्रा के साथ</small></span></label>
    <h3 class="sh">भाव · Prices</h3>
    <label class="opt"><input type="checkbox" id="o_price"><span>भाव दिखाएँ · Show prices<small>सिर्फ़ "लिया हुआ" में</small></span></label>
    <button class="btn wide" id="prGo">🖨️ Print / Save as PDF</button>
    <button class="mi close" data-close>Close</button>
  </div>
</div>

<div id="printArea" aria-hidden="true"></div>

<script src="translit.js"></script>
<script src="items.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
